<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xmas Tree AR</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #050505; 
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; overscroll-behavior: none; 
            -webkit-user-select: none; user-select: none;
        }
        #canvas-container { width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 1; }
        #video-input { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1; } 
        #ui-layer {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
            color: rgba(212, 175, 55, 0.9); pointer-events: none;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
        .status { margin-top: 5px; font-size: 0.8rem; color: #fff; opacity: 0.8; }
        .instructions {
            margin-top: 15px; font-size: 0.75rem; line-height: 1.5;
            background: rgba(0, 20, 10, 0.5); padding: 10px;
            border-left: 2px solid #C41E3A; backdrop-filter: blur(4px);
            border-radius: 4px; max-width: 250px;
        }
        .key-point { color: #50C878; font-weight: bold; }
        #loader {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #D4AF37; font-size: 16px; text-align: center;
            width: 80%; z-index: 20; transition: opacity 0.5s;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loader">
        <div>系统初始化中...</div>
        <div style="font-size:12px; color:#aaa; margin-top:10px;">如果长时间未响应<br>请检查浏览器摄像头权限</div>
    </div>

    <div id="ui-layer">
        <h1>Xmas Tree AR</h1>
        <div class="status" id="status-text">等待摄像头授权...</div>
        <div class="instructions">
            <div>✊ <span class="key-point">握拳</span> : 聚合成树</div>
            <div>🖐 <span class="key-point">张开</span> : 炸开照片</div>
            <div>👋 <span class="key-point">左右</span> : 旋转视角</div>
            <div>👌 <span class="key-point">捏合</span> : 放大观看</div>
        </div>
    </div>

    <video id="video-input" playsinline webkit-playsinline muted></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- 配置 ---
        const CONFIG = {
            particleCount: 1800,
            colors: [
                new THREE.Color('#2D5A27'), new THREE.Color('#D4AF37'),
                new THREE.Color('#C41E3A'), new THREE.Color('#FFFFFF')
            ],
            bloomStrength: 1.2, bloomRadius: 0.5, bloomThreshold: 0.15
        };

        const state = {
            mode: 'scatter', targetModeVal: 0.0, currentModeVal: 0.0,
            rotationY: 0, targetRotationY: 0, zoom: 18, targetZoom: 18
        };

        // --- 纹理生成 ---
        function createTextureAtlas() {
            const canvas = document.createElement('canvas');
            const size = 512;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0,0,size,size);
            const cellSize = size / 4;

            for(let i=0; i<16; i++) {
                const x = (i % 4) * cellSize; const y = Math.floor(i / 4) * cellSize;
                const cx = x + cellSize/2; const cy = y + cellSize/2;
                ctx.save();
                if(i < 4) {
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cellSize/2.5);
                    grad.addColorStop(0, 'rgba(45, 90, 39, 1)'); grad.addColorStop(1, 'rgba(45, 90, 39, 0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, cellSize/2.5, 0, Math.PI*2); ctx.fill();
                } else if (i < 8) {
                    ctx.fillStyle = '#D4AF37'; ctx.font = `${cellSize/1.5}px Arial`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('★', cx, cy);
                } else if (i < 12) {
                    const grad = ctx.createRadialGradient(cx-5, cy-5, 2, cx, cy, cellSize/3);
                    grad.addColorStop(0, '#ff6666'); grad.addColorStop(1, '#C41E3A');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, cellSize/3, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(cx - cellSize/3, cy - cellSize/3, cellSize/1.5, cellSize/1.3);
                    ctx.fillStyle = `hsl(${Math.random()*360}, 50%, 50%)`;
                    ctx.fillRect(cx - cellSize/3 + 3, cy - cellSize/3 + 3, cellSize/1.5 - 6, cellSize/1.5 - 12);
                }
                ctx.restore();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- Three.js 初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.03);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 18);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = CONFIG.bloomThreshold; bloomPass.strength = CONFIG.bloomStrength; bloomPass.radius = CONFIG.bloomRadius;
        composer.addPass(bloomPass);

        // --- 粒子系统 ---
        const geometry = new THREE.BufferGeometry();
        const positions = []; const targets = []; const scatters = []; 
        const colors = []; const sizes = []; const textureIndices = [];

        for (let i = 0; i < CONFIG.particleCount; i++) {
            // Scatter
            const u = Math.random(); const v = Math.random();
            const theta = 2 * Math.PI * u; const phi = Math.acos(2 * v - 1);
            const r = 8 + Math.random() * 10;
            const sx = r * Math.sin(phi) * Math.cos(theta);
            const sy = r * Math.sin(phi) * Math.sin(theta) + 5;
            const sz = r * Math.cos(phi);
            scatters.push(sx, sy, sz); positions.push(sx, sy, sz);

            // Target (Tree)
            const h = Math.random() * 14; 
            const angle = h * 5 + Math.random() * 2;
            const radiusAtH = (14 - h) * 0.35 + Math.random() * 0.4;
            targets.push(radiusAtH * Math.cos(angle), h - 3, radiusAtH * Math.sin(angle));

            // Attributes
            const type = Math.random();
            let c, s, ti;
            if (type > 0.9) { c = CONFIG.colors[3]; s = 0.8+Math.random()*0.5; ti = 12+Math.floor(Math.random()*4); }
            else if (type > 0.75) { c = CONFIG.colors[2]; s = 0.5+Math.random()*0.3; ti = 8+Math.floor(Math.random()*4); }
            else if (type > 0.55) { c = CONFIG.colors[1]; s = 0.4+Math.random()*0.4; ti = 4+Math.floor(Math.random()*4); }
            else { c = CONFIG.colors[0]; s = 0.25+Math.random()*0.3; ti = Math.floor(Math.random()*4); }
            colors.push(c.r, c.g, c.b); sizes.push(s); textureIndices.push(ti);
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('targetPos', new THREE.Float32BufferAttribute(targets, 3));
        geometry.setAttribute('scatterPos', new THREE.Float32BufferAttribute(scatters, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
        geometry.setAttribute('texIdx', new THREE.Float32BufferAttribute(textureIndices, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uMix: { value: 0 }, uTexture: { value: createTextureAtlas() }, uAtlasSize: { value: 4.0 } },
            vertexShader: `
                uniform float uTime; uniform float uMix;
                attribute vec3 targetPos; attribute vec3 scatterPos; attribute vec3 color; attribute float size; attribute float texIdx;
                varying vec3 vColor; varying float vTexIdx;
                void main() {
                    vColor = color; vTexIdx = texIdx;
                    vec3 pos = mix(scatterPos, targetPos, uMix);
                    pos.y += sin(uTime * 3.0 + pos.x * 0.5) * 0.1 * (1.0 - uMix); 
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (350.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture; uniform float uAtlasSize;
                varying vec3 vColor; varying float vTexIdx;
                void main() {
                    float col = mod(vTexIdx, uAtlasSize); float row = floor(vTexIdx / uAtlasSize);
                    vec2 uv = (gl_PointCoord + vec2(col, row)) / uAtlasSize;
                    vec4 texColor = texture2D(uTexture, uv);
                    if (texColor.a < 0.2) discard;
                    gl_FragColor = vec4(texColor.rgb * vColor, 1.0) * 1.2;
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        scene.add(new THREE.Points(geometry, material));

        // --- 2. 关键修改：调用全局 MediaPipe 对象 ---
        function setupMediaPipe() {
            const videoElement = document.getElementById('video-input');
            const statusText = document.getElementById('status-text');

            // 检查库是否加载成功
            if (!window.Hands || !window.Camera) {
                document.getElementById('loader').innerHTML = "脚本加载失败<br>请检查网络连接";
                return;
            }

            const hands = new window.Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    // 简单的手势逻辑
                    const wrist = lm[0];
                    const tips = [lm[8], lm[12], lm[16], lm[20]];
                    const isFist = tips.every(tip => Math.hypot(tip.x - wrist.x, tip.y - wrist.y) < 0.18);
                    const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                    
                    if (isFist) { state.targetModeVal = 1.0; statusText.innerText = "状态: 聚合 (Tree)"; }
                    else if (pinchDist < 0.05) { state.targetZoom = 10; statusText.innerText = "状态: 放大 (Zoom)"; }
                    else { state.targetModeVal = 0.0; state.targetZoom = 18; statusText.innerText = "状态: 散开 (Scatter)"; }
                    
                    state.targetRotationY = (lm[9].x - 0.5) * 5;
                } else {
                    statusText.innerText = "寻找手部...";
                }
            });

            // 启动摄像头
            const camera = new window.Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 320, height: 240, facingMode: 'user'
            });

            camera.start()
                .then(() => {
                    document.getElementById('loader').style.display = 'none';
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loader').innerText = "摄像头调用被拒绝，请重置权限";
                });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = 0.016;
            state.currentModeVal += (state.targetModeVal - state.currentModeVal) * 3.0 * dt;
            state.rotationY += (state.targetRotationY - state.rotationY) * 3.0 * dt;
            state.zoom += (state.targetZoom - state.zoom) * 2.0 * dt;

            material.uniforms.uTime.value = performance.now() / 1000;
            material.uniforms.uMix.value = state.currentModeVal;
            scene.children[0].rotation.y = state.rotationY;
            camera.position.z = state.zoom;
            camera.lookAt(0, 4, 0);
            composer.render();
        }

        setupMediaPipe();
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
