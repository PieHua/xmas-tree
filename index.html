<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musical Xmas Tree AR</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background-color: #020205; /* 背景调更黑一点，突出光感 */
            font-family: 'Courier New', Courier, monospace;
            touch-action: none; overscroll-behavior: none; 
            -webkit-user-select: none; user-select: none;
        }
        #canvas-container { width: 100vw; height: 100dvh; position: absolute; top: 0; left: 0; z-index: 1; }
        /* 视频输入保持隐藏 */
        #video-input { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; z-index: -1; } 
        
        #ui-layer {
            position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10;
            color: rgba(255, 223, 128, 0.9); pointer-events: none;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
        }
        h1 { margin: 0; font-size: 1.3rem; letter-spacing: 1px; }
        .status { margin-top: 5px; font-size: 0.8rem; color: #fff; opacity: 0.8; }
        .instructions {
            margin-top: 15px; font-size: 0.75rem; line-height: 1.6;
            background: rgba(0, 30, 15, 0.6); padding: 12px;
            border-left: 3px solid #C41E3A; backdrop-filter: blur(5px);
            border-radius: 6px; max-width: 260px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .key-point { color: #50C878; font-weight: bold; font-size: 1.1em; }

        /* 启动按钮遮罩层 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        #start-btn {
            padding: 15px 30px; background: #C41E3A; color: #fff; border: none;
            font-size: 1.2rem; border-radius: 30px; cursor: pointer;
            box-shadow: 0 0 20px rgba(196, 30, 58, 0.5); transition: transform 0.2s;
            pointer-events: auto; /* 确保能点击 */
        }
        #start-btn:active { transform: scale(0.95); }
        #loader-text { color: #D4AF37; margin-top: 20px; font-size: 0.9rem; text-align: center;}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="start-overlay">
        <button id="start-btn">🎵 点击播放音乐 & 启动</button>
        <div id="loader-text">正在初始化 AI 与音频引擎...<br>请允许摄像头权限</div>
    </div>

    <audio id="bgm" loop crossorigin="anonymous" src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Ketsa/Ketsas_Christmas_Compilation/Ketsa_-_07_-_Snow_Dust.mp3"></audio>

    <div id="ui-layer">
        <h1>🎄 Musical Xmas Tree</h1>
        <div class="status" id="status-text">准备就绪</div>
        <div class="instructions">
            <div>✊ / 👌 <span class="key-point">握拳或捏合</span> : 聚合圣诞树</div>
            <div>🖐 <span class="key-point">手掌张开</span> : 散开粒子</div>
            <div>👋 <span class="key-point">左右挥动</span> : 旋转视角</div>
            <div style="margin-top:8px; color:#FFD700">✨ 辉光随音乐节奏跳动 ✨</div>
        </div>
    </div>

    <video id="video-input" playsinline webkit-playsinline muted></video>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- 配置 ---
        const CONFIG = {
            particleCount: 2200, // 稍微增加一点粒子，让树更密
            snowCount: 500,     // 新增：雪花数量
            colors: [
                new THREE.Color('#1a5e20'), // 深绿
                new THREE.Color('#ffd700'), // 金色
                new THREE.Color('#d32f2f'), // 红色
                new THREE.Color('#ffffff')  // 白色(礼盒/雪)
            ],
            bloomBaseStrength: 1.0, // 基础辉光强度
            bloomRadius: 0.6,
            bloomThreshold: 0.1
        };

        const state = {
            targetModeVal: 0.0, currentModeVal: 0.0, // 0=Scatter, 1=Tree
            rotationY: 0, targetRotationY: 0, 
            zoom: 18, targetZoom: 18,
            audioReactiveLevel: 0.0 // 音频反应级别
        };

        // --- 音频分析相关变量 ---
        let audioContext, analyser, dataArray, audioSource;
        const audioElement = document.getElementById('bgm');
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        // --- 1. 纹理生成 (更新：绘制礼盒) ---
        function createTextureAtlas() {
            const canvas = document.createElement('canvas');
            const size = 512;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,size,size); // 透明背景
            const cellSize = size / 4;

            for(let i=0; i<16; i++) {
                const x = (i % 4) * cellSize; const y = Math.floor(i / 4) * cellSize;
                const cx = x + cellSize/2; const cy = y + cellSize/2;
                ctx.save();
                if(i < 4) { // 0-3: 绿色光晕 (树叶)
                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, cellSize/2.2);
                    grad.addColorStop(0, 'rgba(45, 120, 50, 1)'); grad.addColorStop(1, 'rgba(45, 120, 50, 0)');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, cellSize/2.2, 0, Math.PI*2); ctx.fill();
                } else if (i < 8) { // 4-7: 金色星星
                    ctx.fillStyle = '#FFD700'; ctx.font = `bold ${cellSize/1.4}px Arial`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; 
                    // 加个发光效果
                    ctx.shadowColor = '#FFD700'; ctx.shadowBlur = 10;
                    ctx.fillText('★', cx, cy);
                } else if (i < 12) { // 8-11: 红色装饰球
                    const grad = ctx.createRadialGradient(cx-cellSize/6, cy-cellSize/6, cellSize/10, cx, cy, cellSize/2.5);
                    grad.addColorStop(0, '#ff8a80'); grad.addColorStop(1, '#c62828');
                    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, cellSize/2.8, 0, Math.PI*2); ctx.fill();
                    // 高光
                    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(cx-cellSize/6, cy-cellSize/6, cellSize/8, 0, Math.PI*2); ctx.fill();
                } else { // 12-15: 更新为【礼盒】
                    const boxSize = cellSize * 0.6;
                    ctx.translate(cx, cy);
                    // 盒子主体 (随机颜色)
                    ctx.fillStyle = `hsl(${Math.random()*360}, 70%, 60%)`;
                    ctx.fillRect(-boxSize/2, -boxSize/2, boxSize, boxSize);
                    // 丝带 (金色/白色)
                    ctx.fillStyle = (i%2===0) ? '#FFF' : '#FFD700';
                    ctx.fillRect(-boxSize/2, -boxSize/6, boxSize, boxSize/3); // 横向
                    ctx.fillRect(-boxSize/6, -boxSize/2, boxSize/3, boxSize); // 纵向
                }
                ctx.restore();
            }
            return new THREE.CanvasTexture(canvas);
        }
        const commonTexture = createTextureAtlas();

        // --- 2. Three.js 初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 更深的迷雾，营造夜晚感
        scene.fog = new THREE.FogExp2(0x020205, 0.04); 
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 6, 18);
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // 性能平衡
        container.appendChild(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = CONFIG.bloomThreshold; 
        bloomPass.strength = CONFIG.bloomBaseStrength; 
        bloomPass.radius = CONFIG.bloomRadius;
        composer.addPass(bloomPass);

        // --- 3. 粒子系统 A: 圣诞树 (改进形态) ---
        const treeGeo = new THREE.BufferGeometry();
        const positions = []; const targets = []; const scatters = []; 
        const colors = []; const sizes = []; const textureIndices = [];

        // 新的树形生成逻辑：分层结构
        const levels = 12; // 树的层数
        let pIdx = 0;
        
        for (let i = 0; i < CONFIG.particleCount; i++) {
            // Scatter 位置 (原本的逻辑)
            const u = Math.random(); const v = Math.random();
            const theta = 2 * Math.PI * u; const phi = Math.acos(2 * v - 1);
            const rScatter = 8 + Math.random() * 12;
            scatters.push(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta) + 6, rScatter * Math.cos(phi));
            positions.push(scatters[i*3], scatters[i*3+1], scatters[i*3+2]);

            // Target (Tree) 位置 - 改进版
            // 决定当前粒子属于哪一层
            const levelIdx = Math.floor((i / CONFIG.particleCount) * levels);
            const levelProgress = (i % (CONFIG.particleCount/levels)) / (CONFIG.particleCount/levels); // 0-1 在层内
            
            // 高度：越往上层越高
            const hBase = (levelIdx / levels) * 15; 
            // 每一层内部也有高度微调
            const h = hBase + levelProgress * (15/levels) * 0.8; 

            // 半径：越往上越窄，但每一层都像一个伞盖(frustum)
            // 基础半径随高度减小
            let baseRadius = (1.0 - h / 16) * 5.5;
            // 叠加分层效果：每层底部宽，顶部窄
            let layerEffect = Math.pow(1.0 - levelProgress, 0.5) * 1.2; 
            // 最终半径
            const radius = baseRadius * layerEffect + Math.random() * 0.3;

            const angle = i * 0.1 + h * 0.5; // 螺旋角度
            targets.push(radius * Math.cos(angle), h - 3.5, radius * Math.sin(angle));

            // Attributes (颜色与类型)
            // 改进：装饰物倾向于分布在半径较大的外侧
            const isOuter = layerEffect > 0.7 && Math.random() > 0.4;
            let c, s, ti;
            
            if (isOuter && Math.random() > 0.7) { // 外层的随机礼盒
                 c = CONFIG.colors[3]; s = 0.9 + Math.random()*0.6; ti = 12+Math.floor(Math.random()*4);
            } else if (isOuter && Math.random() > 0.5) { // 外层的星星
                 c = CONFIG.colors[1]; s = 0.7 + Math.random()*0.5; ti = 4+Math.floor(Math.random()*4);
            } else if (isOuter && Math.random() > 0.3) { // 外层的红球
                 c = CONFIG.colors[2]; s = 0.6 + Math.random()*0.4; ti = 8+Math.floor(Math.random()*4);
            } else { // 内部的绿色枝叶
                 c = CONFIG.colors[0]; s = 0.4 + Math.random()*0.5; ti = Math.floor(Math.random()*4);
            }
            colors.push(c.r, c.g, c.b); sizes.push(s); textureIndices.push(ti);
        }
        treeGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        treeGeo.setAttribute('targetPos', new THREE.Float32BufferAttribute(targets, 3));
        treeGeo.setAttribute('scatterPos', new THREE.Float32BufferAttribute(scatters, 3));
        treeGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        treeGeo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
        treeGeo.setAttribute('texIdx', new THREE.Float32BufferAttribute(textureIndices, 1));

        const treeMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uMix: { value: 0 }, uTexture: { value: commonTexture }, uAtlasSize: { value: 4.0 } },
            vertexShader: `
                uniform float uTime; uniform float uMix;
                attribute vec3 targetPos; attribute vec3 scatterPos; attribute vec3 color; attribute float size; attribute float texIdx;
                varying vec3 vColor; varying float vTexIdx;
                void main() {
                    vColor = color; vTexIdx = texIdx;
                    vec3 pos = mix(scatterPos, targetPos, uMix);
                    // 树状态下微风吹拂效果
                    float wind = sin(uTime * 2.0 + pos.y * 0.5) * 0.08 * uMix * (pos.y*0.1);
                    pos.x += wind; pos.z += wind * 0.5;
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture; uniform float uAtlasSize;
                varying vec3 vColor; varying float vTexIdx;
                void main() {
                    float col = mod(vTexIdx, uAtlasSize); float row = floor(vTexIdx / uAtlasSize);
                    vec2 uv = (gl_PointCoord + vec2(col, row)) / uAtlasSize;
                    vec4 texColor = texture2D(uTexture, uv);
                    if (texColor.a < 0.3) discard;
                    // 颜色混合，并稍微提升亮度
                    gl_FragColor = vec4(texColor.rgb * vColor * 1.5, 1.0);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const treePoints = new THREE.Points(treeGeo, treeMat);
        scene.add(treePoints);

        // --- 4. 粒子系统 B: 飘雪系统 (新增) ---
        const snowGeo = new THREE.BufferGeometry();
        const snowPos = [];
        for(let i=0; i<CONFIG.snowCount; i++) {
             snowPos.push(
                 (Math.random() - 0.5) * 40, // x 范围宽一点
                 Math.random() * 30,         // y 高度
                 (Math.random() - 0.5) * 40  // z 深度
             );
        }
        snowGeo.setAttribute('position', new THREE.Float32BufferAttribute(snowPos, 3));
        
        const snowMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uTexture: { value: commonTexture } },
            vertexShader: `
                uniform float uTime;
                varying float vAlpha;
                void main() {
                    vec3 pos = position;
                    // 下落逻辑：利用取模实现循环下落
                    float fallSpeed = 1.5 + random(vec3(position.x, 0.0, position.z)) * 2.0; // 每个雪花速度不一样
                    pos.y = 30.0 - mod(position.y + uTime * fallSpeed, 30.0);
                    // 飘动逻辑
                    pos.x += sin(uTime + position.z) * 0.5;
                    
                    vAlpha = 1.0 - (pos.y / 30.0); // 越往下越淡
                    
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_PointSize = (3.0 + sin(uTime*random(pos)*5.0)) * (200.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
                // 简单的随机函数
                float random(vec3 st) { return fract(sin(dot(st.xyz, vec3(12.9898,78.233,45.164))) * 43758.5453123); }
            `,
            fragmentShader: `
                uniform sampler2D uTexture; varying float vAlpha;
                void main() {
                    // 使用纹理图集中的第0个(绿色光晕)作为雪花基础，但把它变白
                    vec2 uv = gl_PointCoord / 4.0; 
                    vec4 tex = texture2D(uTexture, uv);
                    if (tex.a < 0.1) discard;
                    // 纯白色雪花
                    gl_FragColor = vec4(1.0, 1.0, 1.0, tex.a * vAlpha * 0.7);
                }
            `,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const snowPoints = new THREE.Points(snowGeo, snowMat);
        scene.add(snowPoints);


        // --- 5. 音频系统初始化 ---
        function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; // 采样大小，越小反应越快
                audioSource = audioContext.createMediaElementSource(audioElement);
                audioSource.connect(analyser);
                analyser.connect(audioContext.destination); // 连接到扬声器
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                audioElement.play().then(()=>{
                     statusText.innerText = "音乐已启动，等待手势...";
                }).catch(e => {
                     statusText.innerText = "音乐播放失败，可能需要再点击一次";
                     console.error("Audio play failed:", e);
                });
            } catch(e) {
                console.error("Web Audio API setup failed:", e);
                statusText.innerText = "音频系统初始化失败";
            }
        }

        // --- 6. MediaPipe & 交互 ---
        function setupMediaPipe() {
            if (!window.Hands || !window.Camera) {
                loader-text.innerHTML = "AI引擎加载失败<br>请检查网络"; return;
            }
            const hands = new window.Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const wrist = lm[0];
                    // 计算五指指尖到手腕的平均距离，判断是否握拳或捏合
                    const tipIndices = [4, 8, 12, 16, 20];
                    let avgDist = 0;
                    tipIndices.forEach(i => { avgDist += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y); });
                    avgDist /= 5;

                    // 改进的交互逻辑：距离小就是聚合，大就是张开
                    if (avgDist < 0.35) { // 阈值需要根据实际体验调整
                        state.targetModeVal = 1.0; // 聚合
                        statusText.innerText = "🎄 状态: 聚合 (Tree)";
                    } else {
                        state.targetModeVal = 0.0; // 散开
                        statusText.innerText = "✨ 状态: 散开 (Scatter)";
                    }
                    // 旋转控制
                    state.targetRotationY = (lm[9].x - 0.5) * 4;
                } else if (audioContext && audioContext.state === 'running') {
                    statusText.innerText = "🎵 音乐播放中 - 请举手...";
                }
            });

            const camera = new window.Camera(document.getElementById('video-input'), {
                onFrame: async () => { await hands.send({image: document.getElementById('video-input')}); },
                width: 320, height: 240, facingMode: 'user'
            });
            camera.start()
                .then(() => { document.getElementById('loader-text').innerText = "摄像头已就绪，请点击按钮启动"; startBtn.style.background="#2D5A27"; })
                .catch(err => { console.error(err); document.getElementById('loader-text').innerText = "摄像头被拒绝，请检查权限"; });
        }

        // --- 7. 动画循环 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const dt = 0.016;

            // A. 音频分析
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                // 计算平均音量/能量
                let sum = 0;
                // 只取低频和中频部分，节奏感更强
                for(let i = 0; i < dataArray.length * 0.6; i++) { sum += dataArray[i]; }
                const avgLevel = sum / (dataArray.length * 0.6);
                // 平滑过渡
                state.audioReactiveLevel += (avgLevel / 255.0 - state.audioReactiveLevel) * 0.2;
                
                // 将音频能量映射到辉光强度 (基础强度 + 音频增益)
                bloomPass.strength = CONFIG.bloomBaseStrength + state.audioReactiveLevel * 2.5;
                // 也可以让树稍微根据音乐缩放一点点
                treePoints.scale.setScalar(1.0 + state.audioReactiveLevel * 0.05);
            }

            // B. 状态平滑过渡
            state.currentModeVal += (state.targetModeVal - state.currentModeVal) * 2.5 * dt;
            state.rotationY += (state.targetRotationY - state.rotationY) * 3.0 * dt;

            // C. 更新 Uniforms
            treeMat.uniforms.uTime.value = time;
            treeMat.uniforms.uMix.value = state.currentModeVal;
            snowMat.uniforms.uTime.value = time;

            // D. 应用变换
            treePoints.rotation.y = state.rotationY;
            // 缓慢自动旋转，增加动感
            treePoints.rotation.y += time * 0.05;
            snowPoints.rotation.y = time * 0.02; // 雪花整体也要慢慢转

            camera.lookAt(0, 5, 0);
            composer.render();
        }

        // --- 启动流程 ---
        startBtn.addEventListener('click', () => {
            // 必须在用户点击事件中恢复/启动 AudioContext
            if (!audioContext) initAudio();
            else if (audioContext.state === 'suspended') audioContext.resume();
            
            startOverlay.style.opacity = '0';
            startOverlay.style.pointerEvents = 'none';
            // 延迟移除
            setTimeout(() => startOverlay.remove(), 1000);
        });

        setupMediaPipe();
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
